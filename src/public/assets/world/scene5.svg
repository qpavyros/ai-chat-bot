<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg5" cx="46%" cy="40%" r="88%">
      <stop offset="0%" stop-color="#0c2158"/>
      <stop offset="48%" stop-color="#081740"/>
      <stop offset="100%" stop-color="#050d24"/>
    </radialGradient>
    <linearGradient id="ray5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#57dffe" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#57dffe" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="55%" stop-color="#9fc6ff" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#00288e" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="barHi" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00288e"/>
      <stop offset="100%" stop-color="#57dffe"/>
    </linearGradient>
    <linearGradient id="barLo" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#16307c"/>
      <stop offset="100%" stop-color="#3f7dff"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ab4ff" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#7deaff"/>
    </linearGradient>
    <filter id="soft5" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glow5" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blurBig5" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="50"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg5)"/>

  <!-- volumetric rays -->
  <polygon points="700,-60 920,-60 520,1140 360,1140" fill="url(#ray5)" opacity=".45"/>
  <polygon points="1420,-60 1560,-60 1300,1140 1180,1140" fill="url(#ray5)" opacity=".35"/>

  <!-- bokeh -->
  <g filter="url(#blurBig5)">
    <circle cx="240" cy="260" r="100" fill="#2e63ff" opacity=".14"/>
    <circle cx="1720" cy="240" r="90" fill="#57dffe" opacity=".12"/>
    <circle cx="1800" cy="800" r="120" fill="#2e63ff" opacity=".12"/>
    <circle cx="140" cy="880" r="80" fill="#57dffe" opacity=".10"/>
  </g>

  <!-- rising light streaks (growth) -->
  <g stroke="#57dffe" stroke-linecap="round" filter="url(#glow5)">
    <line x1="1500" y1="640" x2="1500" y2="470" stroke-width="3" opacity=".55"><animate attributeName="y1" values="660;450" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y2" values="500;300" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="1580" y1="720" x2="1580" y2="560" stroke-width="2.4" opacity=".4"><animate attributeName="y1" values="740;520" dur="3.1s" begin=".7s" repeatCount="indefinite"/><animate attributeName="y2" values="570;370" dur="3.1s" begin=".7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="3.1s" begin=".7s" repeatCount="indefinite"/></line>
    <line x1="1660" y1="600" x2="1660" y2="430" stroke-width="2" opacity=".35"><animate attributeName="y1" values="620;420" dur="2.3s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="y2" values="450;260" dur="2.3s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.45;0" dur="2.3s" begin="1.3s" repeatCount="indefinite"/></line>
  </g>

  <!-- ============ main dashboard panel ============ -->
  <g transform="translate(880 560) rotate(-3)">
    <ellipse cx="0" cy="20" rx="640" ry="380" fill="#2e63ff" opacity=".12" filter="url(#blurBig5)"/>
    <rect x="-620" y="-330" width="1240" height="680" rx="42" fill="url(#glass5)" stroke="#ffffff" stroke-opacity=".5" stroke-width="2.5"/>
    <rect x="-590" y="-327" width="1180" height="5" rx="2.5" fill="#ffffff" opacity=".6"/>
    <!-- window dots + title bar -->
    <circle cx="-566" cy="-284" r="11" fill="#ff8fa3" opacity=".85"/>
    <circle cx="-530" cy="-284" r="11" fill="#ffd166" opacity=".85"/>
    <circle cx="-494" cy="-284" r="11" fill="#6ee7a0" opacity=".85"/>
    <rect x="-440" y="-292" width="200" height="16" rx="8" fill="#ffffff" opacity=".25"/>
    <line x1="-620" y1="-250" x2="620" y2="-250" stroke="#ffffff" stroke-opacity=".12"/>

    <!-- bar chart: rising heights left→right -->
    <g>
      <rect x="-520" y="60"   width="92" height="180" rx="14" fill="url(#barLo)" opacity=".75"/>
      <rect x="-396" y="10"   width="92" height="230" rx="14" fill="url(#barLo)" opacity=".82"/>
      <rect x="-272" y="-40"  width="92" height="280" rx="14" fill="url(#barLo)" opacity=".9"/>
      <rect x="-148" y="-96"  width="92" height="336" rx="14" fill="url(#barHi)" opacity=".95"/>
      <rect x="-24"  y="-160" width="92" height="400" rx="14" fill="url(#barHi)"/>
      <rect x="100"  y="-216" width="92" height="456" rx="14" fill="url(#barHi)" filter="url(#glow5)"/>
      <rect x="224"  y="-268" width="92" height="508" rx="14" fill="url(#barHi)" filter="url(#glow5)"/>
      <!-- baseline -->
      <line x1="-540" y1="244" x2="340" y2="244" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>
    </g>

    <!-- glowing trend line over the bars -->
    <polyline points="-474,120 -350,64 -226,6 -102,-58 22,-128 146,-186 270,-238"
      fill="none" stroke="#eafcff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
      filter="url(#glow5)" opacity=".95"/>
    <g fill="#ffffff" filter="url(#glow5)">
      <circle cx="22" cy="-128" r="8"/><circle cx="146" cy="-186" r="8"/><circle cx="270" cy="-238" r="10"/>
    </g>
    <!-- pulse on last node -->
    <circle cx="270" cy="-238" r="10" fill="none" stroke="#57dffe"><animate attributeName="r" values="10;26" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="1.8s" repeatCount="indefinite"/></circle>

    <!-- mini stat row under chart -->
    <g fill="#ffffff" opacity=".3">
      <rect x="-520" y="280" width="170" height="12" rx="6"/>
      <rect x="-320" y="280" width="110" height="12" rx="6"/>
      <rect x="-520" y="306" width="90" height="12" rx="6" opacity=".6"/>
    </g>
  </g>

  <!-- ============ floating stat cards ============ -->
  <g transform="translate(1520 400) rotate(6)">
    <rect x="-110" y="-110" width="220" height="220" rx="34" fill="url(#glass5)" stroke="#ffffff" stroke-opacity=".45" stroke-width="2"/>
    <circle cx="0" cy="-8" r="62" fill="none" stroke="#12306e" stroke-width="13"/>
    <circle cx="0" cy="-8" r="62" fill="none" stroke="#57dffe" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="292" stroke-dashoffset="73" transform="rotate(-90)" filter="url(#glow5)"/>
    <circle cx="0" cy="86" r="6" fill="#57dffe" opacity=".8"/>
    <rect x="-52" y="76" width="104" height="12" rx="6" fill="#ffffff" opacity=".35"/>
  </g>

  <g transform="translate(1610 780) rotate(-5)">
    <rect x="-120" y="-84" width="240" height="168" rx="30" fill="url(#glass5)" stroke="#ffffff" stroke-opacity=".4" stroke-width="2"/>
    <polyline points="-84,44 -44,18 -4,30 36,-8 76,-38" fill="none" stroke="url(#spark)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow5)"/>
    <circle cx="76" cy="-38" r="7" fill="#7deaff" filter="url(#glow5)"/>
    <path d="M56 -62 l20 -24 8 10 -20 24 z" fill="#7deaff" opacity=".9"/>
  </g>

  <g transform="translate(230 760) rotate(-7)">
    <rect x="-105" y="-72" width="210" height="144" rx="28" fill="url(#glass5)" stroke="#ffffff" stroke-opacity=".4" stroke-width="2"/>
    <g fill="#ffd166" filter="url(#soft5)">
      <path d="M0 -46 12 -14 46 -14 19 7 29 40 0 21 -29 40 -19 7 -46 -14 -12 -14 Z" opacity=".95"/>
    </g>
    <g fill="#ffd166">
      <path d="M0 -46 12 -14 46 -14 19 7 29 40 0 21 -29 40 -19 7 -46 -14 -12 -14 Z" opacity=".95"/>
    </g>
    <rect x="-58" y="54" width="116" height="11" rx="5.5" fill="#ffffff" opacity=".35"/>
  </g>

  <!-- floating shards -->
  <circle cx="420" cy="240" r="22" fill="none" stroke="#57dffe" stroke-opacity=".4" stroke-width="2"/>
  <g transform="rotate(20 1740 560)"><rect x="1716" y="536" width="48" height="48" rx="12" fill="url(#glass5)" stroke="#ffffff" stroke-opacity=".3"/></g>
</svg>
