<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#0c2158"/>
      <stop offset="45%" stop-color="#081740"/>
      <stop offset="100%" stop-color="#050d24"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#57dffe" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#57dffe" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="55%" stop-color="#9fc6ff" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#00288e" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12306e"/>
      <stop offset="100%" stop-color="#0a1c48"/>
    </linearGradient>
    <linearGradient id="bubbleUser" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7deaff" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#2bb8dd" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="bubbleBot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a5bd9" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#1c2f86" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="formGhost" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57dffe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#57dffe" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".75"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blurBig" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="46"/></filter>
    <g id="lines">
      <rect x="0" y="0" width="150" height="12" rx="6" fill="#ffffff" opacity=".5"/>
      <rect x="0" y="24" width="96" height="12" rx="6" fill="#ffffff" opacity=".28"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- volumetric rays -->
  <polygon points="1180,-80 1420,-80 1080,1160 900,1160" fill="url(#ray)" opacity=".5"/>
  <polygon points="1520,-80 1660,-80 1420,1160 1300,1160" fill="url(#ray)" opacity=".35"/>
  <polygon points="240,-80 380,-80 120,1160 20,1160" fill="url(#ray)" opacity=".25"/>

  <!-- bokeh field -->
  <g filter="url(#blurBig)">
    <circle cx="300" cy="220" r="90" fill="#57dffe" opacity=".13"/>
    <circle cx="1650" cy="180" r="120" fill="#2e63ff" opacity=".16"/>
    <circle cx="1760" cy="720" r="70" fill="#57dffe" opacity=".11"/>
    <circle cx="160" cy="820" r="110" fill="#2e63ff" opacity=".12"/>
    <circle cx="980" cy="130" r="60" fill="#8ab4ff" opacity=".12"/>
  </g>

  <!-- floating glass shards -->
  <g transform="rotate(18 320 640)"><rect x="290" y="610" width="70" height="70" rx="16" fill="url(#body)" stroke="#ffffff" stroke-opacity=".3"/></g>
  <g transform="rotate(-14 1620 480)"><rect x="1590" y="450" width="58" height="58" rx="14" fill="url(#body)" stroke="#ffffff" stroke-opacity=".28"/></g>
  <circle cx="1470" cy="250" r="26" fill="none" stroke="#57dffe" stroke-opacity=".35" stroke-width="2"/>

  <!-- ============ the phone ============ -->
  <g transform="translate(960 540) rotate(-5)">
    <!-- ambient glow behind device -->
    <ellipse cx="30" cy="30" rx="420" ry="520" fill="#57dffe" opacity=".1" filter="url(#blurBig)"/>

    <!-- body -->
    <rect x="-230" y="-430" width="460" height="880" rx="64" fill="url(#body)" stroke="#ffffff" stroke-opacity=".55" stroke-width="2.5"/>
    <rect x="-216" y="-416" width="432" height="852" rx="52" fill="url(#screen)"/>
    <!-- top-edge specular -->
    <rect x="-190" y="-427" width="380" height="4" rx="2" fill="#ffffff" opacity=".65"/>
    <!-- notch -->
    <rect x="-70" y="-396" width="140" height="22" rx="11" fill="#04102e" opacity=".9"/>
    <!-- online status strip -->
    <circle cx="-168" cy="-344" r="9" fill="#4ade80" filter="url(#glow)"/>
    <rect x="-146" y="-350" width="120" height="11" rx="5.5" fill="#ffffff" opacity=".4"/>
    <line x1="-216" y1="-310" x2="216" y2="-310" stroke="#ffffff" stroke-opacity=".12"/>

    <!-- chat: user bubbles right (RTL), bot replies left -->
    <g>
      <rect x="36" y="-270" width="180" height="66" rx="20" fill="url(#bubbleUser)"/><use href="#lines" x="56" y="-245"/>
      <rect x="-196" y="-182" width="212" height="66" rx="20" fill="url(#bubbleBot)" stroke="#8ab4ff" stroke-opacity=".4"/><use href="#lines" x="-172" y="-157"/>
      <rect x="76" y="-94" width="140" height="66" rx="20" fill="url(#bubbleUser)"/><use href="#lines" x="96" y="-69"/>
      <rect x="-196" y="-6" width="238" height="66" rx="20" fill="url(#bubbleBot)" stroke="#8ab4ff" stroke-opacity=".4"/><use href="#lines" x="-172" y="19"/>
      <rect x="16" y="82" width="200" height="66" rx="20" fill="url(#bubbleUser)"/><use href="#lines" x="36" y="107"/>
      <!-- latest complete bot bubble with typing dots -->
      <rect x="-196" y="170" width="206" height="66" rx="20" fill="url(#bubbleBot)" stroke="#8ab4ff" stroke-opacity=".5"/>
      <circle cx="-146" cy="203" r="7" fill="#cfe4ff" opacity=".95"><animate attributeName="opacity" values=".25;.95;.25" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="-112" cy="203" r="7" fill="#cfe4ff" opacity=".7"><animate attributeName="opacity" values=".95;.25;.95" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="-78" cy="203" r="7" fill="#cfe4ff" opacity=".45"><animate attributeName="opacity" values=".25;.95;.25" dur="1.6s" begin=".8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- forming reply bubble mid-air: ghost outline assembling -->
    <g filter="url(#glow)">
      <rect x="-150" y="292" width="230" height="62" rx="20" fill="none" stroke="url(#formGhost)" stroke-width="2.5" stroke-dasharray="14 10" opacity=".85"/>
      <use href="#lines" x="-122" y="315" opacity=".35"/>
    </g>
    <!-- particles streaming up into the forming bubble -->
    <g fill="#57dffe" filter="url(#glow)">
      <circle cx="-40" cy="392" r="4" opacity=".9"><animate attributeName="cy" values="400;330" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="10" cy="404" r="3" opacity=".7"><animate attributeName="cy" values="412;334" dur="2.2s" begin=".5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="2.2s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="-96" cy="398" r="3.4" opacity=".8"><animate attributeName="cy" values="406;330" dur="2s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="58" cy="396" r="2.6" opacity=".6"><animate attributeName="cy" values="402;336" dur="1.7s" begin=".3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="1.7s" begin=".3s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- vignette -->
  <rect width="1920" height="1080" fill="#050d24" opacity="0" style="mix-blend-mode:multiply"/>
</svg>
