<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول — لوحة المشغّل</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="/public/tailwind.css" rel="stylesheet" />
<style>
  body { font-family: "IBM Plex Sans Arabic", sans-serif; }
  .banner-error { background:#ffdad6; color:#93000a; padding:10px 14px; border-radius:0.6rem; font-size:13px; min-height:0; display:none; }
  .banner-error.show { display:block; }
  .spinner { display:none; width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite; }
  .loading .spinner { display:inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-4">

<form class="bg-surface-container-lowest rounded-2xl shadow-[0px_8px_24px_rgba(0,0,0,0.10)] border border-outline-variant p-8 w-full max-w-[380px]" id="loginForm">
  <div class="text-center mb-6">
    <h1 class="font-headline-lg text-[22px] font-bold text-primary mb-1">ساعدني AI</h1>
    <h2 class="font-headline-md text-[17px] font-semibold text-on-surface">لوحة تحكم المشغّل</h2>
    <p class="text-sm text-on-surface-variant mt-1">الرجاء إدخال كلمة السر للمتابعة</p>
  </div>

  <label class="block text-sm font-medium text-on-surface-variant mb-2" for="password">كلمة السر</label>
  <input class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 text-on-surface outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all mb-4" type="password" id="password" name="password" autofocus required>

  <div class="banner-error" id="error"></div>

  <button type="submit" id="submitBtn" class="w-full bg-primary hover:bg-primary-container text-on-primary font-bold py-3 rounded-lg transition-colors flex items-center justify-center gap-2 disabled:opacity-60 mt-2">
    <span class="spinner"></span>
    <span>دخول</span>
  </button>
</form>

<script>
  var form = document.getElementById('loginForm');
  var errorEl = document.getElementById('error');
  var submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorEl.classList.remove('show');
    errorEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.classList.add('loading');
    var password = document.getElementById('password').value;

    fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (result.ok) {
          window.location.href = '/admin';
          return;
        }
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        errorEl.textContent = result.data.error || 'صار خطأ';
        errorEl.classList.add('show');
      })
      .catch(function () {
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        errorEl.textContent = 'تعذّر الاتصال بالسيرفر';
        errorEl.classList.add('show');
      });
  });
</script>
</body>
</html>
