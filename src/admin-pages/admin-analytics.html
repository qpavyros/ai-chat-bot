<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>التحليلات — لوحة المشغّل</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<link href="/public/tailwind.css" rel="stylesheet" />
<style>
  body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 20px; direction: ltr; }
</style>
</head>
<body class="bg-background text-on-background min-h-screen">

<header class="flex flex-row-reverse justify-between items-center w-full px-6 md:px-10 h-16 max-w-[1400px] mx-auto bg-surface border-b border-outline-variant sticky top-0 z-50">
  <div class="font-headline-md text-headline-md font-bold text-primary shrink-0">ساعدني AI — أدمن</div>
  <nav class="flex flex-row-reverse gap-8 flex-1 justify-center mr-8">
    <a class="text-on-surface-variant hover:text-primary transition-colors text-sm" href="/admin">العملاء</a>
    <a class="text-on-surface-variant hover:text-primary transition-colors text-sm" href="/admin/escalations">التصعيدات</a>
    <a class="text-primary font-bold border-b-2 border-primary pb-1 text-sm" href="/admin/analytics">التحليلات</a>
  </nav>
  <button type="button" id="logout-btn" class="text-sm text-on-surface-variant border border-outline-variant rounded-lg px-4 py-2 hover:bg-surface-container-low transition-colors">تسجيل الخروج</button>
</header>

<main class="max-w-[1400px] mx-auto px-6 md:px-10 py-8">
  <h1 class="font-headline-md text-headline-md text-on-surface mb-6">تحليلات العملاء</h1>

  <div class="bg-surface rounded-xl border border-outline-variant shadow-sm p-6 mb-6">
    <div class="flex justify-between items-center flex-wrap gap-3 mb-4">
      <h3 class="text-sm font-semibold text-on-surface">الاستخدام آخر ١٤ يوم</h3>
      <div class="text-sm text-on-surface-variant" id="stats-cost-line"></div>
    </div>
    <div id="stats-chart" dir="ltr" class="flex items-end gap-1" style="height:140px;"></div>
    <div class="flex gap-4 mt-3 text-xs text-on-surface-variant" dir="ltr">
      <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm inline-block" style="background:#00288e;"></span>رسائل LLM</span>
      <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm inline-block" style="background:#94a3b8;"></span>ردود كاش</span>
      <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm inline-block" style="background:#eab308;"></span>خارج الدوام</span>
    </div>
  </div>

  <div id="loading" class="text-center py-16 text-on-surface-variant">لحظة...</div>

  <div id="table-wrap" class="bg-surface rounded-xl border border-outline-variant shadow-sm overflow-hidden" style="display:none;">
    <div class="overflow-x-auto">
      <table class="w-full text-right border-collapse">
        <thead>
          <tr class="bg-surface-container-low border-b border-outline-variant">
            <th class="py-4 px-6 text-xs text-on-surface-variant font-semibold whitespace-nowrap">الشركة</th>
            <th class="py-4 px-6 text-xs text-on-surface-variant font-semibold whitespace-nowrap">الحالة</th>
            <th class="py-4 px-6 text-xs text-on-surface-variant font-semibold whitespace-nowrap">زبائن فريدون</th>
            <th class="py-4 px-6 text-xs text-on-surface-variant font-semibold whitespace-nowrap">نشطون آخر 7 أيام</th>
            <th class="py-4 px-6 text-xs text-on-surface-variant font-semibold whitespace-nowrap">طلبات</th>
            <th class="py-4 px-6 text-xs text-on-surface-variant font-semibold whitespace-nowrap">مواعيد</th>
            <th class="py-4 px-6 text-xs text-on-surface-variant font-semibold whitespace-nowrap">تصعيدات (غير معالجة)</th>
          </tr>
        </thead>
        <tbody id="analytics-body" class="divide-y divide-outline-variant"></tbody>
      </table>
    </div>
    <div id="empty-state" class="text-center py-16 text-on-surface-variant" style="display:none;">ما في بيانات كافية بعد.</div>
  </div>
</main>

<script>
(function () {
  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function api(url, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    return fetch(url, opts).then(function (res) {
      if (res.status === 401) { window.location.href = "/admin/login"; throw new Error("unauthorized"); }
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.error || "صار خطأ");
        return data;
      });
    });
  }

  document.getElementById("logout-btn").addEventListener("click", function () {
    api("/admin/logout", { method: "POST" }).then(function () { window.location.href = "/admin/login"; });
  });

  function loadAnalytics() {
    return api("/admin/api/analytics").then(function (data) {
      var analytics = data.analytics || [];
      var body = document.getElementById("analytics-body");
      var empty = document.getElementById("empty-state");
      document.getElementById("loading").style.display = "none";
      document.getElementById("table-wrap").style.display = "block";

      if (!analytics.length) {
        body.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      body.innerHTML = analytics.map(function (c) {
        var statusBadge = c.status === "active"
          ? '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium" style="background:#ecfdf5; color:#059669;">فعّال</span>'
          : '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium" style="background:#ffdad6; color:#93000a;">موقوف</span>';
        var escalationsCell = c.totalEscalations
          ? esc(c.totalEscalations) + " (" + esc(c.unhandledEscalations) + ")"
          : "0";
        return (
          '<tr class="hover:bg-surface-container-lowest transition-colors">' +
          '<td class="py-4 px-6"><div class="text-sm font-semibold">' + esc(c.displayName) + '</div><div class="text-xs text-on-surface-variant" dir="ltr">' + esc(c.clientId) + '</div></td>' +
          '<td class="py-4 px-6">' + statusBadge + '</td>' +
          '<td class="py-4 px-6 text-sm">' + esc(c.uniqueCustomers) + '</td>' +
          '<td class="py-4 px-6 text-sm">' + esc(c.activeLast7Days) + '</td>' +
          '<td class="py-4 px-6 text-sm">' + esc(c.totalOrders) + '</td>' +
          '<td class="py-4 px-6 text-sm">' + esc(c.totalAppointments) + '</td>' +
          '<td class="py-4 px-6 text-sm">' + escalationsCell + '</td>' +
          '</tr>'
        );
      }).join("");
    }).catch(function (err) {
      if (err.message !== "unauthorized") {
        document.getElementById("loading").textContent = "صار خطأ بتحميل التحليلات.";
      }
    });
  }

  function loadStats() {
    return api("/admin/api/stats").then(function (data) {
      var chart = document.getElementById("stats-chart");
      var costLine = document.getElementById("stats-cost-line");
      var days = data.days || [];

      var max = 1;
      days.forEach(function (d) { max = Math.max(max, d.llmCalls, d.cacheHits, d.offHours); });

      chart.innerHTML = "";
      days.forEach(function (d) {
        var col = document.createElement("div");
        col.style.cssText = "flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:2px; height:100%;";
        var mkBar = function (v, color) {
          var bar = document.createElement("div");
          bar.style.cssText = "width:70%; background:" + color + "; border-radius:3px 3px 0 0; min-height:" + (v > 0 ? 3 : 0) + "px;";
          bar.style.height = Math.round((v / max) * 100) + "%";
          bar.title = d.date.slice(5) + " — LLM: " + d.llmCalls + "، كاش: " + d.cacheHits + "، خارج دوام: " + d.offHours +
            "، رسائل: " + d.messages + "، تكلفة ≈ $" + d.costUsd.toFixed(4);
          return bar;
        };
        var stack = document.createElement("div");
        stack.style.cssText = "display:flex; flex-direction:column-reverse; justify-content:flex-end; width:100%; height:100%; gap:1px;";
        stack.appendChild(mkBar(d.llmCalls, "#00288e"));
        stack.appendChild(mkBar(d.cacheHits, "#94a3b8"));
        stack.appendChild(mkBar(d.offHours, "#eab308"));

        var label = document.createElement("div");
        label.style.cssText = "font-size:0.65rem; color:#757684; white-space:nowrap;";
        label.textContent = d.date.slice(8);

        col.appendChild(stack);
        col.appendChild(label);
        chart.appendChild(col);
      });

      costLine.innerHTML = "💰 تكلفة DeepSeek التقديرية هالشهر: <strong>$" + Number(data.monthToDateCostUsd || 0).toFixed(2) + "</strong>";
    }).catch(function () { /* صامت — الإحصائيات مش حرجة */ });
  }

  loadAnalytics();
  loadStats();
  setInterval(loadStats, 60 * 1000);
})();
</script>

</body>
</html>
