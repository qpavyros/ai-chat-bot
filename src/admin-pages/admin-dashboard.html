<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إدارة العملاء — لوحة المشغّل</title>
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<link href="/public/tailwind.css" rel="stylesheet" />
<style>
  body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 20px; direction: ltr; }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-background text-on-background min-h-screen">

<header class="flex flex-row-reverse justify-between items-center w-full px-6 md:px-10 h-16 max-w-[1400px] mx-auto bg-surface border-b border-outline-variant sticky top-0 z-50">
  <div class="font-headline-md text-headline-md font-bold text-primary shrink-0">ساعدني AI — أدمن</div>
  <nav class="flex flex-row-reverse gap-8 flex-1 justify-center mr-8">
    <a class="text-primary font-bold border-b-2 border-primary pb-1 text-sm" href="/admin">العملاء</a>
    <a class="text-on-surface-variant hover:text-primary transition-colors text-sm" href="/admin/escalations">التصعيدات</a>
    <a class="text-on-surface-variant hover:text-primary transition-colors text-sm" href="/admin/analytics">التحليلات</a>
  </nav>
  <button type="button" id="logout-btn" class="text-sm text-on-surface-variant border border-outline-variant rounded-lg px-4 py-2 hover:bg-surface-container-low transition-colors">تسجيل الخروج</button>
</header>

<main class="max-w-[1400px] mx-auto px-6 md:px-10 py-8">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
    <div>
      <h1 class="font-headline-md text-headline-md text-on-surface">إدارة العملاء</h1>
      <p class="text-on-surface-variant mt-1 text-sm">عرض وإدارة الحسابات النشطة، الباقات، وتاريخ الصلاحية.</p>
    </div>
    <a href="/admin/legacy?add=1" class="bg-primary hover:bg-primary-container text-on-primary text-sm font-medium py-2.5 px-6 rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2" style="text-decoration:none;">
      <span class="material-symbols-outlined text-[20px]">add</span>إضافة عميل
    </a>
  </div>

  <div class="bg-surface rounded-xl p-4 shadow-sm mb-6 flex flex-col lg:flex-row gap-4 justify-between items-center border border-outline-variant/40">
    <div class="relative w-full lg:w-96 flex-shrink-0">
      <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline">search</span>
      <input id="search-input" class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-2.5 pr-10 pl-4 text-sm text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="البحث باسم الشركة أو المعرّف..." type="text" />
    </div>
    <div class="flex flex-row gap-3 w-full lg:w-auto overflow-x-auto pb-2 lg:pb-0 hide-scrollbar">
      <div class="flex items-center gap-2 shrink-0">
        <label class="text-sm text-on-surface-variant">الحالة:</label>
        <select id="status-filter" class="bg-surface-container-lowest border border-outline-variant rounded-lg py-2 px-3 text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary cursor-pointer min-w-[120px]">
          <option value="all">الكل</option>
          <option value="active">فعّال</option>
          <option value="disabled">موقوف</option>
          <option value="expiring">قارب الانتهاء</option>
        </select>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <label class="text-sm text-on-surface-variant">الباقة:</label>
        <select id="plan-filter" class="bg-surface-container-lowest border border-outline-variant rounded-lg py-2 px-3 text-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary cursor-pointer min-w-[120px]">
          <option value="all">الكل</option>
          <option value="none">بدون</option>
          <option value="starter">Starter</option>
          <option value="growth">Growth</option>
          <option value="pro">Pro</option>
        </select>
      </div>
    </div>
  </div>

  <div id="loading" class="text-center py-16 text-on-surface-variant">لحظة...</div>

  <div id="table-wrap" class="bg-surface rounded-xl shadow-sm border border-outline-variant overflow-hidden mb-6" style="display:none;">
    <div class="overflow-x-auto">
      <table class="w-full text-right border-collapse">
        <thead>
          <tr class="bg-surface-container-low border-b border-outline-variant">
            <th class="py-4 px-6 text-xs text-on-surface-variant font-semibold whitespace-nowrap">اسم الشركة</th>
            <th class="py-4 px-6 text-xs text-on-surface-variant font-semibold whitespace-nowrap">الباقة</th>
            <th class="py-4 px-6 text-xs text-on-surface-variant font-semibold whitespace-nowrap">الحالة</th>
            <th class="py-4 px-6 text-xs text-on-surface-variant font-semibold whitespace-nowrap">تاريخ الانتهاء</th>
            <th class="py-4 px-6 text-xs text-on-surface-variant font-semibold whitespace-nowrap">إعداد واتساب</th>
            <th class="py-4 px-6 text-xs text-on-surface-variant font-semibold whitespace-nowrap">ملفات المعرفة</th>
            <th class="py-4 px-6 text-xs text-on-surface-variant font-semibold whitespace-nowrap text-center">إجراء</th>
          </tr>
        </thead>
        <tbody id="clients-body" class="divide-y divide-outline-variant"></tbody>
      </table>
    </div>
    <div id="empty-state" class="text-center py-14 text-on-surface-variant" style="display:none;">ما في عملاء مطابقين.</div>
    <div class="bg-surface-container-lowest px-6 py-4 border-t border-outline-variant flex items-center justify-between flex-wrap gap-3">
      <div id="pagination-info" class="text-sm text-on-surface-variant"></div>
      <div id="pagination-controls" class="flex items-center gap-2"></div>
    </div>
  </div>
</main>

<script>
(function () {
  var ONBOARDING_STEP_COUNT = 8;
  var TIER_LABELS = { starter: "Starter", growth: "Growth", pro: "Pro" };
  var PAGE_SIZE = 15;
  var allClients = [];
  var currentPage = 1;

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function api(url, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    return fetch(url, opts).then(function (res) {
      if (res.status === 401) { window.location.href = "/admin/login"; throw new Error("unauthorized"); }
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.error || "صار خطأ");
        return data;
      });
    });
  }

  function daysUntil(dateStr) {
    if (!dateStr) return null;
    return Math.ceil((new Date(dateStr).getTime() - Date.now()) / (1000 * 60 * 60 * 24));
  }

  function effectiveStatus(c) {
    if (c.status === "disabled") return "disabled";
    var days = daysUntil(c.expiresAt);
    if (days !== null && days <= 7) return "expiring";
    return "active";
  }

  function statusBadge(status) {
    if (status === "disabled") return '<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-error-container text-on-error-container"><span class="w-1.5 h-1.5 rounded-full bg-error"></span>موقوف</span>';
    if (status === "expiring") return '<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium" style="background:#fff2df; color:#8a5300;"><span class="w-1.5 h-1.5 rounded-full" style="background:#eab308;"></span>قارب الانتهاء</span>';
    return '<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium" style="background:#ecfdf5; color:#059669;"><span class="w-1.5 h-1.5 rounded-full" style="background:#059669;"></span>فعّال</span>';
  }

  function planBadge(tier) {
    if (tier === "growth") return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-primary-fixed text-primary">Growth</span>';
    if (tier === "pro") return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium" style="background:#f3e5f5; color:#7b1fa2;">Pro</span>';
    if (tier === "starter") return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium" style="background:#e6f4ea; color:#146c2e;">Starter</span>';
    return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-surface-container text-on-surface-variant">بدون</span>';
  }

  function checklistDoneCount(c) {
    var cl = c.onboardingChecklist || {};
    return Object.keys(cl).filter(function (k) { return cl[k]; }).length;
  }

  function avatarLetter(name) {
    return (name || "?").trim().charAt(0).toUpperCase();
  }

  function renderRow(c) {
    var status = effectiveStatus(c);
    var doneCount = checklistDoneCount(c);
    var pct = Math.round((doneCount / ONBOARDING_STEP_COUNT) * 100);
    var expiryLabel = status === "disabled" && !c.expiresAt
      ? '<span class="text-on-surface-variant">بدون تاريخ</span>'
      : (c.expiresAt ? new Date(c.expiresAt).toLocaleDateString("ar") : '<span class="text-on-surface-variant">بدون تاريخ</span>');

    var referralHtml = "";
    if (c.pendingReferralRewards && c.pendingReferralRewards.length) {
      referralHtml = '<div class="flex flex-wrap gap-1 mt-1">' + c.pendingReferralRewards.map(function (r) {
        return '<button type="button" data-apply-referral="' + esc(r.clientId) + '" class="text-xs border border-outline-variant rounded-full px-2 py-0.5 hover:bg-surface-container-low transition-colors">🎁 مستحقة من ' + esc(r.displayName) + '</button>';
      }).join("") + '</div>';
    }

    return (
      '<tr class="hover:bg-surface-container-lowest transition-colors">' +
      '<td class="py-4 px-6"><div class="flex items-center gap-3">' +
      '<div class="w-10 h-10 rounded-full bg-primary-container/20 text-primary flex items-center justify-center font-bold flex-none">' + esc(avatarLetter(c.displayName)) + '</div>' +
      '<div><div class="text-sm text-on-surface font-semibold">' + esc(c.displayName) + '</div><div class="text-xs text-on-surface-variant" dir="ltr">' + esc(c.id) + '</div>' + referralHtml + '</div>' +
      '</div></td>' +
      '<td class="py-4 px-6">' + planBadge(c.tier) + '</td>' +
      '<td class="py-4 px-6">' + statusBadge(status) + '</td>' +
      '<td class="py-4 px-6 text-sm">' + expiryLabel + '</td>' +
      '<td class="py-4 px-6 min-w-[150px]"><div class="flex items-center gap-2">' +
      '<div class="w-full bg-surface-container rounded-full h-2"><div class="bg-primary h-2 rounded-full" style="width:' + pct + '%;"></div></div>' +
      '<span class="text-xs text-on-surface-variant whitespace-nowrap">' + doneCount + '/' + ONBOARDING_STEP_COUNT + '</span>' +
      '</div></td>' +
      '<td class="py-4 px-6"><div class="flex items-center gap-1.5 text-on-surface-variant">' +
      '<span class="material-symbols-outlined text-[18px]">folder</span><span class="text-sm font-semibold">' + esc(c.knowledgeFiles.length) + '</span>' +
      '</div></td>' +
      '<td class="py-4 px-6 text-center"><a href="/admin/client/' + encodeURIComponent(c.id) + '" class="text-primary hover:bg-surface-container-low font-semibold text-sm px-3 py-1.5 rounded transition-colors" style="text-decoration:none;">فتح</a></td>' +
      '</tr>'
    );
  }

  function applyFilters() {
    var q = document.getElementById("search-input").value.trim().toLowerCase();
    var statusFilter = document.getElementById("status-filter").value;
    var planFilter = document.getElementById("plan-filter").value;

    return allClients.filter(function (c) {
      if (q && c.displayName.toLowerCase().indexOf(q) === -1 && c.id.toLowerCase().indexOf(q) === -1) return false;
      if (statusFilter !== "all" && effectiveStatus(c) !== statusFilter) return false;
      if (planFilter !== "all") {
        var planKey = c.tier || "none";
        if (planKey !== planFilter) return false;
      }
      return true;
    });
  }

  function renderPagination(total) {
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (currentPage > pages) currentPage = pages;
    var controls = document.getElementById("pagination-controls");
    var info = document.getElementById("pagination-info");
    var start = total === 0 ? 0 : (currentPage - 1) * PAGE_SIZE + 1;
    var end = Math.min(total, currentPage * PAGE_SIZE);
    info.textContent = total === 0 ? "ما في نتائج" : "عرض " + start + "-" + end + " من أصل " + total + " عميل";

    var html = "";
    html += '<button type="button" data-page="' + (currentPage - 1) + '" ' + (currentPage <= 1 ? "disabled" : "") + ' class="w-8 h-8 flex items-center justify-center rounded border border-outline-variant text-on-surface hover:bg-surface-container-low disabled:opacity-40 disabled:cursor-not-allowed"><span class="material-symbols-outlined text-[18px]">chevron_right</span></button>';
    for (var p = 1; p <= pages; p++) {
      if (pages > 7 && p !== 1 && p !== pages && Math.abs(p - currentPage) > 1) {
        if (p === 2 || p === pages - 1) html += '<span class="text-on-surface-variant px-1">…</span>';
        continue;
      }
      html += '<button type="button" data-page="' + p + '" class="w-8 h-8 flex items-center justify-center rounded text-sm font-semibold ' +
        (p === currentPage ? "bg-primary text-on-primary" : "border border-transparent text-on-surface hover:bg-surface-container-low") + '">' + p + "</button>";
    }
    html += '<button type="button" data-page="' + (currentPage + 1) + '" ' + (currentPage >= pages ? "disabled" : "") + ' class="w-8 h-8 flex items-center justify-center rounded border border-outline-variant text-on-surface hover:bg-surface-container-low disabled:opacity-40 disabled:cursor-not-allowed"><span class="material-symbols-outlined text-[18px]">chevron_left</span></button>';
    controls.innerHTML = html;

    controls.querySelectorAll("[data-page]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        currentPage = Number(btn.getAttribute("data-page"));
        render();
      });
    });
  }

  function render() {
    var filtered = applyFilters();
    var body = document.getElementById("clients-body");
    var empty = document.getElementById("empty-state");

    if (!filtered.length) {
      body.innerHTML = "";
      empty.style.display = "block";
      renderPagination(0);
      return;
    }
    empty.style.display = "none";

    var startIdx = (currentPage - 1) * PAGE_SIZE;
    var pageItems = filtered.slice(startIdx, startIdx + PAGE_SIZE);
    body.innerHTML = pageItems.map(renderRow).join("");
    renderPagination(filtered.length);

    body.querySelectorAll("[data-apply-referral]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        var referredId = btn.getAttribute("data-apply-referral");
        if (!confirm("تأكيد تطبيق مكافأة الإحالة (تمديد شهرين) لهالعميل؟")) return;
        api("/admin/api/clients/" + referredId + "/apply-referral-reward", { method: "POST" })
          .then(function () {
            return api("/admin/api/clients");
          })
          .then(function (data) {
            allClients = data.clients || [];
            render();
          })
          .catch(function (err) { alert(err.message); });
      });
    });
  }

  ["search-input"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", function () { currentPage = 1; render(); });
  });
  ["status-filter", "plan-filter"].forEach(function (id) {
    document.getElementById(id).addEventListener("change", function () { currentPage = 1; render(); });
  });

  document.getElementById("logout-btn").addEventListener("click", function () {
    api("/admin/logout", { method: "POST" }).then(function () { window.location.href = "/admin/login"; });
  });

  api("/admin/api/clients").then(function (data) {
    allClients = data.clients || [];
    document.getElementById("loading").style.display = "none";
    document.getElementById("table-wrap").style.display = "block";
    render();
  }).catch(function (err) {
    if (err.message !== "unauthorized") {
      document.getElementById("loading").textContent = "صار خطأ بتحميل العملاء.";
    }
  });
})();
</script>

</body>
</html>
